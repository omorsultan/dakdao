<!DOCTYPE html>
<html>
<head>
    <title>Login - Dakdao</title>
</head>
<body>

    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="text"
            id="mobile"
            placeholder="Mobile"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <script src="./js/login.js"></script>

</body>
</html>
