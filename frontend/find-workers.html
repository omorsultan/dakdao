<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Workers — DakDao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

    <nav class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="customer-home.html" class="h-9 w-9 bg-gray-50 hover:bg-gray-100 rounded-xl flex items-center justify-center border border-gray-200 text-gray-600 transition shadow-sm">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </a>
                <div>
                    <span class="text-xs text-gray-400 font-medium block">Directory / Discovery</span>
                    <span class="font-bold text-gray-900 tracking-tight">Find Professionals</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-md font-bold id='total-workers-count'">DakDao Talent Pool</span>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-black text-gray-900 tracking-tight">Available Workforce</h1>
                <p class="text-xs text-gray-500 mt-0.5">Explore, search, and connect with verified local field workers.</p>
            </div>
            <div class="relative max-w-md w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </div>
                <input 
                    type="text" 
                    id="search-input" 
                    oninput="handleSearchFilter()"
                    class="block w-full pl-9 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" 
                    placeholder="Search workers by name or skills..."
                >
            </div>
        </div>

        <div id="workers-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-gray-100 animate-pulse space-y-4">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 bg-gray-200 rounded-full"></div>
                    <div class="flex-1 space-y-2"><div class="h-4 bg-gray-200 rounded w-2/3"></div><div class="h-3 bg-gray-200 rounded w-1/3"></div></div>
                </div>
                <div class="h-3 bg-gray-200 rounded w-full"></div>
                <div class="h-8 bg-gray-200 rounded w-full"></div>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-gray-100 animate-pulse space-y-4">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 bg-gray-200 rounded-full"></div>
                    <div class="flex-1 space-y-2"><div class="h-4 bg-gray-200 rounded w-1/2"></div><div class="h-3 bg-gray-200 rounded w-1/4"></div></div>
                </div>
                <div class="h-3 bg-gray-200 rounded w-full"></div>
                <div class="h-8 bg-gray-200 rounded w-full"></div>
            </div>
        </div>
    </main>

    <script>
        const API = "http://localhost:5000";
        const token = localStorage.getItem("token") || "";

        let runtimeWorkersCache = [];

        // 1. INITIAL SYSTEM DIRECTORY DATA EXTRACTION
        async function fetchWorkersDirectory() {
            const grid = document.getElementById("workers-grid");
            try {
                const response = await fetch(`${API}/api/workers`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.success && data.workers.length > 0) {
                    runtimeWorkersCache = data.workers;
                    renderWorkersDisplayList(runtimeWorkersCache);
                } else {
                    grid.innerHTML = `
                        <div class="col-span-full bg-white p-12 text-center rounded-2xl border border-gray-100 shadow-sm text-gray-400">
                            <i class="fa-solid fa-users-slash text-3xl mb-2 block text-gray-300"></i>
                            <p class="text-sm">No registered workers found inside database arrays.</p>
                        </div>`;
                }
            } catch (err) {
                grid.innerHTML = `
                    <div class="col-span-full bg-rose-50 border border-rose-100 p-8 text-center rounded-2xl text-rose-700 text-sm">
                        <i class="fa-solid fa-triangle-exclamation text-xl mb-1"></i>
                        <p>Failed connecting to backend API nodes. Ensure server app layer is operational on port 5000.</p>
                    </div>`;
            }
        }

        // 2. RENDERING PIPELINE ENGINE
        function renderWorkersDisplayList(workersList) {
            const grid = document.getElementById("workers-grid");
            
            grid.innerHTML = workersList.map(worker => {
                // Generate safe initial letter placeholder if profile image array state is null
                const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(worker.full_name)}&background=f4f4f5&color=18181b&bold=true`;
                const profileImgSrc = worker.profile_image ? `${API}${worker.profile_image}` : fallbackAvatar;

                // Handle mapping the skill tags seamlessly
                const skillsBadges = worker.skills.length > 0 
                    ? worker.skills.map(skill => `<span class="text-[11px] font-medium bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-md border border-gray-200/40">${escapeHtml(skill)}</span>`).join("")
                    : `<span class="text-xs text-gray-400 italic">No specific skill parameters added.</span>`;

                return `
                    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between relative group overflow-hidden">
                        
                        <div>
                            <div class="flex items-start justify-between gap-3 pb-4 border-b border-gray-50">
                                <div class="flex items-center space-x-3.5">
                                    <img src="${profileImgSrc}" alt="Avatar" class="w-14 h-14 object-cover rounded-full border-2 border-gray-100 shadow-inner flex-shrink-0" onerror="this.src='${fallbackAvatar}'">
                                    <div>
                                        <h3 class="font-bold text-gray-900 tracking-tight flex items-center gap-1.5 text-base">
                                            ${escapeHtml(worker.full_name)}
                                            ${worker.is_verified ? `<i class="fa-solid fa-circle-check text-indigo-600 text-sm" title="DakDao Verified Pro"></i>` : ""}
                                        </h3>
                                        <p class="text-xs text-gray-400 flex items-center mt-0.5">
                                            <i class="fa-solid fa-location-dot text-gray-400 mr-1 text-[11px]"></i> ${escapeHtml(worker.location)}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4">
                                <h4 class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-2">Expertise Fields</h4>
                                <div class="flex flex-wrap gap-1.5">
                                    ${skillsBadges}
                                </div>
                            </div>
                        </div>

                        <div class="mt-6 pt-4 border-t border-gray-50 flex items-center justify-between text-xs text-gray-400">
                            <span>Joined: ${new Date(worker.joined_at).toLocaleDateString('en-GB', {month:'short', year:'numeric'})}</span>
                            <button class="px-3 py-1.5 bg-gray-50 text-gray-700 hover:bg-indigo-600 hover:text-white border border-gray-200 hover:border-indigo-600 font-semibold rounded-lg transition shadow-sm flex items-center space-x-1">
                                <i class="fa-solid fa-address-card"></i>
                                <span>View Profile</span>
                            </button>
                        </div>
                    </div>`;
            }).join("");
        }

        // 3. REAL-TIME SEARCH FILTER SYSTEM
        function handleSearchFilter() {
            const query = document.getElementById("search-input").value.toLowerCase().trim();
            
            if (!query) {
                renderWorkersDisplayList(runtimeWorkersCache);
                return;
            }

            const filtered = runtimeWorkersCache.filter(worker => {
                const matchName = worker.full_name.toLowerCase().includes(query);
                const matchSkills = worker.skills.some(skill => skill.toLowerCase().includes(query));
                const matchLocation = worker.location.toLowerCase().includes(query);
                
                return matchName || matchSkills || matchLocation;
            });

            renderWorkersDisplayList(filtered);
        }

        // HTML XSS Protection Escape Vector Utility
        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Boot system query execution sequences on asset parsing readiness
        document.addEventListener("DOMContentLoaded", fetchWorkersDirectory);
    </script>
</body>
</html>
